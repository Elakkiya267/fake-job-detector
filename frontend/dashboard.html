<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - JobGuard</title>
    <meta name="description" content="View your job posting analysis history and detection statistics on JobGuard Dashboard.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ── Dashboard-specific styles ── */
        .dashboard-hero {
            padding: 40px 0 20px;
            text-align: center;
        }
        .dashboard-hero h2 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .dashboard-hero p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 24px 0;
        }
        .stat-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
        }
        .stat-box .stat-num {
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 6px;
        }
        .stat-box .stat-lbl {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-box.total .stat-num  { color: #63b3ed; }
        .stat-box.legit .stat-num  { color: #68d391; }
        .stat-box.fake  .stat-num  { color: #fc8181; }
        .stat-box.avg   .stat-num  { color: #f6ad55; }

        /* Content grid */
        .dash-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-panel, .history-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
        }
        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-wrap {
            width: 220px;
            margin: 0 auto;
        }

        /* History table */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .history-header .panel-title { margin-bottom: 0; }
        .btn-clear {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-clear:hover {
            border-color: #fc8181;
            color: #fc8181;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .history-table th {
            text-align: left;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 10px 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .history-table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            vertical-align: middle;
        }
        .history-table tr:last-child td { border-bottom: none; }
        .history-table tr:hover td { background: rgba(255,255,255,0.02); }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.legit { background: rgba(104,211,145,0.15); color: #68d391; }
        .badge.fake  { background: rgba(252,129,129,0.15); color: #fc8181; }

        .score-pill {
            display: inline-block;
            font-weight: 600;
            font-size: 13px;
            min-width: 36px;
            text-align: center;
        }
        .score-pill.high { color: #68d391; }
        .score-pill.mid  { color: #f6ad55; }
        .score-pill.low  { color: #fc8181; }

        .time-lbl { color: var(--text-muted); font-size: 12px; }

        /* Empty state */
        .empty-dash {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .empty-dash .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty-dash p { margin-bottom: 16px; font-size: 14px; }

        /* No-data donut overlay */
        .chart-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 220px;
            color: var(--text-muted);
            font-size: 13px;
            flex-direction: column;
            gap: 8px;
        }
        .chart-empty .icon { font-size: 32px; }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .dash-grid  { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">🛡️</div>
                    <h1>JobGuard</h1>
                </div>
                <nav class="nav">
                    <a href="index.html"     class="nav-link">Detector</a>
                    <a href="dashboard.html" class="nav-link active">Dashboard</a>
                    <a href="chatbot.html"   class="nav-link">Career Assistant</a>
                    <a href="about.html"     class="nav-link">About</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="main">
        <div class="container">

            <!-- Hero -->
            <div class="dashboard-hero">
                <h2>📊 Detection Dashboard</h2>
                <p>Your job posting analysis history at a glance</p>
            </div>

            <!-- Stat cards -->
            <div class="stats-row">
                <div class="stat-box total">
                    <div class="stat-num" id="totalScans">0</div>
                    <div class="stat-lbl">Total Scanned</div>
                </div>
                <div class="stat-box legit">
                    <div class="stat-num" id="legitimateCount">0</div>
                    <div class="stat-lbl">Legitimate</div>
                </div>
                <div class="stat-box fake">
                    <div class="stat-num" id="fakeCount">0</div>
                    <div class="stat-lbl">Fake Detected</div>
                </div>
                <div class="stat-box avg">
                    <div class="stat-num" id="avgScore">—</div>
                    <div class="stat-lbl">Avg Score</div>
                </div>
            </div>

            <!-- Chart + History -->
            <div class="dash-grid">

                <!-- Donut chart -->
                <div class="chart-panel">
                    <div class="panel-title">🥧 Detection Ratio</div>
                    <div id="chartContainer">
                        <div class="chart-empty" id="chartEmpty">
                            <span class="icon">📋</span>
                            <span>No data yet</span>
                        </div>
                        <div class="chart-wrap" id="chartWrap" style="display:none;">
                            <canvas id="ratioChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Recent history -->
                <div class="history-panel">
                    <div class="history-header">
                        <div class="panel-title">🕒 Recent Detections</div>
                        <button class="btn-clear" id="clearHistoryBtn">🗑 Clear History</button>
                    </div>
                    <div id="historyContent"></div>
                </div>

            </div>

        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
